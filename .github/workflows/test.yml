name: Run tests

on:
  pull_request:
    # ready_for_review: PRs opened by a workflow (Prepare release) get no CI
    # until someone marks them ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    tags:
      - test
  # Called by release.yml, which runs the same jobs as a dispatch on main.
  workflow_call:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit sha to test (e.g. a reviewed contributor PR commit). Workflow, terraform, Rakefile and test/support still come from the dispatched ref."
        required: false
        default: ""

permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.run_id) || 'azure-infra' }}
  cancel-in-progress: false
env:
  ARM_SKIP_PROVIDER_REGISTRATION: true
  ARM_USE_OIDC: true
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: approve-external-sha
    if: ${{ !cancelled() && needs.approve-external-sha.result != 'failure' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/checkout-sha
        with:
          sha: ${{ inputs.sha }}
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rubocop
  # A sha run gives the contributor's code the repository secrets, so only the
  # maintainer who reviewed that commit may dispatch it. The dispatch is the approval.
  approve-external-sha:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: inputs.sha != ''
    steps:
      - name: Check who dispatched the sha run
        env:
          SHA: ${{ inputs.sha }}
          DISPATCHER: ${{ github.triggering_actor }}
        run: |
          if [ "$DISPATCHER" != "JoeDupuis" ]; then
            echo "::error::Only JoeDupuis can run a contributor sha with repository credentials, not $DISPATCHER"
            exit 1
          fi
          echo "$DISPATCHER approved running $SHA with repository credentials"

  deploy-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: approve-external-sha
    if: ${{ !cancelled() && needs.approve-external-sha.result != 'failure' && (startsWith(github.ref, 'refs/tags/test') || github.event_name == 'workflow_dispatch') }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-terraform
      - name: Terraform apply
        run: terraform apply -auto-approve -var "create_vm=true" -var "create_app_service=true" -var "create_aks=true" -var "ssh_key=${{ secrets.SSH_PUBLIC_KEY }}"

  app_service_test:
    needs: deploy-infrastructure
    if: ${{ !cancelled() && needs.deploy-infrastructure.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips sshuttle sqlite3 libsqlite3-dev
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/checkout-sha
        with:
          sha: ${{ inputs.sha }}
      - uses: ./.github/actions/setup-terraform
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Tests
        env:
          AZURE_ACCOUNT_NAME: ${{secrets.AZURE_ACCOUNT_NAME}}
          AZURE_ACCESS_KEY: ${{secrets.AZURE_ACCESS_KEY}}
          AZURE_PRIVATE_CONTAINER: ${{secrets.AZURE_PRIVATE_CONTAINER}}
          AZURE_PUBLIC_CONTAINER: ${{secrets.AZURE_PUBLIC_CONTAINER}}
          AZURE_PRINCIPAL_ID: ${{secrets.AZURE_PRINCIPAL_ID}}
        run: bundle exec rake test_app_service

  azurevm_test:
    needs: deploy-infrastructure
    if: ${{ !cancelled() && needs.deploy-infrastructure.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips sshuttle sqlite3 libsqlite3-dev
      - name: SSH key
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          mkdir -p /home/runner/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /home/runner/.ssh/id_rsa
          chmod 600 /home/runner/.ssh/id_rsa
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add /home/runner/.ssh/id_rsa
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/checkout-sha
        with:
          sha: ${{ inputs.sha }}
      - uses: ./.github/actions/setup-terraform
      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Tests
        env:
          AZURE_ACCOUNT_NAME: ${{secrets.AZURE_ACCOUNT_NAME}}
          AZURE_ACCESS_KEY: ${{secrets.AZURE_ACCESS_KEY}}
          AZURE_PRIVATE_CONTAINER: ${{secrets.AZURE_PRIVATE_CONTAINER}}
          AZURE_PUBLIC_CONTAINER: ${{secrets.AZURE_PUBLIC_CONTAINER}}
          AZURE_PRINCIPAL_ID: ${{secrets.AZURE_PRINCIPAL_ID}}
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: bundle exec rake test_azure_vm

  aks_test:
    needs: deploy-infrastructure
    if: ${{ !cancelled() && needs.deploy-infrastructure.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips sshuttle sqlite3 libsqlite3-dev
      - name: SSH key
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          mkdir -p /home/runner/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /home/runner/.ssh/id_rsa
          chmod 600 /home/runner/.ssh/id_rsa
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add /home/runner/.ssh/id_rsa
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/checkout-sha
        with:
          sha: ${{ inputs.sha }}
      - uses: ./.github/actions/setup-terraform
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Tests
        env:
          AZURE_ACCOUNT_NAME: ${{secrets.AZURE_ACCOUNT_NAME}}
          AZURE_PRIVATE_CONTAINER: ${{secrets.AZURE_PRIVATE_CONTAINER}}
          AZURE_PUBLIC_CONTAINER: ${{secrets.AZURE_PUBLIC_CONTAINER}}
          USE_MANAGED_IDENTITIES: true
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: bundle exec rake test_aks

  azurite_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: approve-external-sha
    if: ${{ !cancelled() && needs.approve-external-sha.result != 'failure' }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
      - name: Install Azurite
        run: npm install -g azurite
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips sqlite3 libsqlite3-dev
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/checkout-sha
        with:
          sha: ${{ inputs.sha }}
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Run Azurite tests
        env:
          AZURE_PRIVATE_CONTAINER: ${{ secrets.AZURE_PRIVATE_CONTAINER }}
          AZURE_PUBLIC_CONTAINER: ${{ secrets.AZURE_PUBLIC_CONTAINER }}
          AZURE_PRINCIPAL_ID: ${{ secrets.AZURE_PRINCIPAL_ID }}
        run: bundle exec rake test_azurite

  client_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: approve-external-sha
    if: ${{ !cancelled() && needs.approve-external-sha.result != 'failure' }}
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips sqlite3 libsqlite3-dev
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/checkout-sha
        with:
          sha: ${{ inputs.sha }}
      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Client tests
        env:
          AZURE_ACCOUNT_NAME: ${{secrets.AZURE_ACCOUNT_NAME}}
          AZURE_ACCESS_KEY: ${{secrets.AZURE_ACCESS_KEY}}
          AZURE_PRIVATE_CONTAINER: ${{secrets.AZURE_PRIVATE_CONTAINER}}
          AZURE_PUBLIC_CONTAINER: ${{secrets.AZURE_PUBLIC_CONTAINER}}
          AZURE_PRINCIPAL_ID: ${{secrets.AZURE_PRINCIPAL_ID}}
        run: bundle exec rake test_client

  rails_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: approve-external-sha
    if: ${{ !cancelled() && needs.approve-external-sha.result != 'failure' }}
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips sqlite3 libsqlite3-dev
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/checkout-sha
        with:
          sha: ${{ inputs.sha }}
      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Rails tests
        env:
          AZURE_ACCOUNT_NAME: ${{secrets.AZURE_ACCOUNT_NAME}}
          AZURE_ACCESS_KEY: ${{secrets.AZURE_ACCESS_KEY}}
          AZURE_PRIVATE_CONTAINER: ${{secrets.AZURE_PRIVATE_CONTAINER}}
          AZURE_PUBLIC_CONTAINER: ${{secrets.AZURE_PUBLIC_CONTAINER}}
          AZURE_PRINCIPAL_ID: ${{secrets.AZURE_PRINCIPAL_ID}}
        run: bundle exec rake test_rails

