name: Prepare release

# To release a new version:
# 1. Actions > Prepare release > Run workflow, with the new version (e.g. 0.9.0).
#    It opens a draft PR that bumps the version and dates the CHANGELOG entries.
# 2. Mark that PR ready for review to run CI, then merge it.
# 3. Actions > Release > Run workflow on main. Tick dry_run to try it without
#    publishing. It runs the full test suite, then publishes the gem, the
#    v0.9.0 tag and the GitHub Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.9.0 (no v)"
        required: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the release branch
      pull-requests: write # open the release PR
    env:
      VERSION: ${{ inputs.version }}
      DISPATCHER: ${{ github.triggering_actor }}
    steps:
      - name: Check who dispatched and the version
        run: |
          if [ "$DISPATCHER" != "JoeDupuis" ]; then
            echo "::error::Only JoeDupuis can prepare a release, not $DISPATCHER"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "::error::$VERSION is not a version like 0.9.0 or 0.5.9.1"
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Bump version, Gemfile.lock and CHANGELOG
        run: |
          if ! awk '/^## \[Unreleased\]$/ {on=1; next} /^## \[/ {on=0} on && /^- /' CHANGELOG.md | grep -q .; then
            echo "::error::CHANGELOG.md has nothing under [Unreleased]"
            exit 1
          fi
          sed -i "s/VERSION = \".*\"/VERSION = \"$VERSION\"/" lib/azure_blob/version.rb
          sed -i "s/^    azure-blob (.*)$/    azure-blob ($VERSION)/" Gemfile.lock
          sed -i "s/^## \[Unreleased\]$/## [Unreleased]\n\n## [$VERSION] $(date -u +%F)/" CHANGELOG.md
          git diff
      - name: Push the release branch
        run: |
          git switch -c "release-$VERSION"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "$VERSION"
          git push origin "release-$VERSION"
      - name: Open the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="Bumps the version to $VERSION. Mark this PR ready for review to run CI, merge it, then run the Release workflow on main."
          if url=$(gh pr create --repo "$GITHUB_REPOSITORY" --draft --base main --head "release-$VERSION" --title "$VERSION" --body "$body"); then
            echo "Release PR: $url. Mark it ready for review to run CI." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Couldn't open the PR. Allow GitHub Actions to create pull requests in the repository's Actions settings, or open it yourself"
            echo "Open the release PR: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...release-$VERSION?expand=1" >> "$GITHUB_STEP_SUMMARY"
          fi
